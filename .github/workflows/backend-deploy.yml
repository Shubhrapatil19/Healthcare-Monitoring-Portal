name: Backend Deploy

on:
  push:
    branches:
      - Backend1
  workflow_dispatch:

concurrency:
  group: healthcare-backend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy backend to private app server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.APP_SSH_PRIVATE_KEY }}

          proxy_host: ${{ secrets.JUMP_HOST }}
          proxy_username: ${{ secrets.JUMP_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}

          command_timeout: 30m

          script: |
            set -e

            echo "Starting backend deployment..."

            sudo -u backend1 bash -lc '
              set -e

              REPO=/opt/project/backend1/Healthcare-Monitoring-Portal
              MODULE=$REPO/healthcare-monitoring-system
              PRODUCTION_PROPERTIES=/home/backend1/healthcare-production/application.properties
              APPLICATION_PROPERTIES=$MODULE/src/main/resources/application.properties

              test -f "$PRODUCTION_PROPERTIES"
              grep -q "^app.backend-url=" "$PRODUCTION_PROPERTIES"

              cd "$REPO"

              echo "Cleaning tracked server changes..."
              git restore .

              git fetch origin Backend1
              git checkout Backend1
              git pull --ff-only origin Backend1

              echo "Restoring production application.properties..."
              cp "$PRODUCTION_PROPERTIES" "$APPLICATION_PROPERTIES"

              echo "Building backend..."
              cd "$MODULE"

              bash ./mvnw clean package -DskipTests

              test -f target/healthcare-monitoring-system-0.0.1-SNAPSHOT.jar

              echo "Deployed commit:"
              git -C "$REPO" log -1 --oneline

              echo "BACKEND BUILD SUCCESS"
            '

            sudo systemctl restart healthcare

            echo "Waiting for backend startup..."

            for attempt in $(seq 1 45); do
              if sudo systemctl is-active --quiet healthcare && \
                 curl -fsS http://127.0.0.1:5081/v3/api-docs >/dev/null 2>&1
              then
                echo "BACKEND DEPLOYMENT SUCCESS"
                exit 0
              fi

              if [ "$attempt" -eq 45 ]; then
                echo "BACKEND DEPLOYMENT FAILED"
                sudo systemctl status healthcare --no-pager -l
                sudo journalctl -u healthcare -n 100 --no-pager -l
                exit 1
              fi

              sleep 2
            done
