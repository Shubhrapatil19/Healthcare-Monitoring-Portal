name: Frontend Deploy

on:
  push:
    branches:
      - Frontend
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy Frontend
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.APP_HOST }}
          username: ${{ secrets.APP_USER }}
          key: ${{ secrets.APP_SSH_PRIVATE_KEY }}

          proxy_host: ${{ secrets.JUMP_HOST }}
          proxy_username: ${{ secrets.JUMP_USER }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY }}

          command_timeout: 25m

          script: |
            set -e

            sudo -u frontend1 bash -lc '
              set -e

              cd /opt/project/frontend1/Healthcare-Monitoring-Portal

              git fetch origin Frontend
              git checkout Frontend
              git pull --ff-only origin Frontend

              printf "%s\n" \
                "VITE_USE_MOCK=false" \
                "VITE_API_BASE_URL=/api" > .env

              rm -rf dist .vite

              export NODE_OPTIONS="--max-old-space-size=768"

              npm ci --no-audit --no-fund
              npm run build

              test -f dist/index.html

              echo "Deployed commit:"
              git log -1 --oneline
            '

            sudo systemctl restart frontend
            sleep 3

            sudo systemctl is-active --quiet frontend
            curl -fsS http://127.0.0.1:8081/ >/dev/null

            echo "FRONTEND DEPLOYMENT SUCCESS"
